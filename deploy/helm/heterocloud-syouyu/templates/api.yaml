{{- $antiAffinity := dict -}}
{{- if eq .Values.api.scheduling.antiAffinity "required" -}}
{{- $antiAffinity = dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "syouyu.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "api")) "topologyKey" .Values.api.scheduling.topologyKey))) -}}
{{- else if eq .Values.api.scheduling.antiAffinity "preferred" -}}
{{- $term := dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "syouyu.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "api")) "topologyKey" .Values.api.scheduling.topologyKey -}}
{{- $antiAffinity = dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "weight" 100 "podAffinityTerm" $term))) -}}
{{- end -}}
{{- $affinity := mergeOverwrite (deepCopy $antiAffinity) (.Values.api.scheduling.affinity | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syouyu.fullname" . }}-api
  labels:
    {{- include "syouyu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "syouyu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "syouyu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "syouyu.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "syouyu.podSecurityContext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.scheduling.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.scheduling.topologySpread.maxSkew }}
          topologyKey: {{ .Values.api.scheduling.topologyKey }}
          whenUnsatisfiable: {{ .Values.api.scheduling.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "syouyu.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      {{- with .Values.api.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "syouyu.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/syouyu-api"]
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: SYOUYU_BIND_ADDR
              value: {{ .Values.api.bindAddress | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "syouyu.secretName" . }}
                  key: {{ .Values.secrets.keys.databaseUrl }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.api.migrateOnStart | quote }}
            - name: SYOUYU_RECEIPT_ENCRYPTION_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ include "syouyu.secretName" . }}
                  key: {{ .Values.secrets.keys.receiptEncryptionKey }}
            - name: HETEROCLOUD_PROVIDER_ISSUER
              value: {{ .Values.providerAuth.issuer | quote }}
            - name: HETEROCLOUD_PROVIDER_AUDIENCE
              value: {{ .Values.providerAuth.audience | quote }}
            - name: HETEROCLOUD_PROVIDER_PUBLIC_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "syouyu.secretName" . }}
                  key: {{ .Values.secrets.keys.providerPublicKeys }}
            - name: SYOUYU_PRINCIPAL_ISSUER
              value: {{ .Values.principalAuth.issuer | quote }}
            - name: SYOUYU_PRINCIPAL_AUDIENCE
              value: {{ .Values.principalAuth.audience | quote }}
            - name: SYOUYU_PRINCIPAL_MAX_TTL_SECONDS
              value: {{ .Values.principalAuth.maxTokenTtlSeconds | quote }}
            - name: SYOUYU_PRINCIPAL_CONTEXT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "syouyu.secretName" . }}
                  key: {{ .Values.secrets.keys.principalContextHmacSecret }}
            - name: SYOUYU_MAX_CREDENTIALS_PER_BUCKET
              value: {{ .Values.credentialLimits.maxPerBucket | quote }}
            - name: SYOUYU_MAX_TOTAL_CREDENTIALS
              value: {{ .Values.credentialLimits.maxPerOrganization | quote }}
            - name: GARAGE_ADMIN_ENDPOINT
              value: {{ printf "http://%s-garage-admin:%v" (include "syouyu.fullname" .) .Values.garage.adminService.port | quote }}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syouyu.secretName" . }}
                  key: {{ .Values.secrets.keys.garageAdminToken }}
            - name: SYOUYU_S3_PUBLIC_ENDPOINT
              value: {{ default (printf "http://%s-s3.%s.svc:%v" (include "syouyu.fullname" .) .Release.Namespace .Values.garage.s3Service.port) .Values.garage.s3Service.publicEndpoint | quote }}
            - name: RUST_LOG
              value: {{ .Values.api.logFilter | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          securityContext:
            {{- include "syouyu.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syouyu.fullname" . }}-api
  labels:
    {{- include "syouyu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "syouyu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
