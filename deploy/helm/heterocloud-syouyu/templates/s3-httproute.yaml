{{- if .Values.garage.gateway.enabled }}
{{- if not .Values.garage.gateway.parentRefs }}
{{- fail "garage.gateway.parentRefs is required when Garage Gateway routing is enabled" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "syouyu.fullname" . }}-s3
  labels:
    {{- include "syouyu.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
  {{- with .Values.garage.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.garage.gateway.parentRefs }}
    - name: {{ required "garage.gateway.parentRefs[].name is required" .name }}
      {{- with .group }}
      group: {{ . }}
      {{- end }}
      {{- with .kind }}
      kind: {{ . }}
      {{- end }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .Values.garage.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "syouyu.fullname" . }}-s3
          port: {{ .Values.garage.s3Service.port }}
          weight: 1
{{- end }}
