{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syouyu.secretName" . }}
  labels:
    {{- include "syouyu.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.values.databaseUrl is required when secrets.create=true" .Values.secrets.values.databaseUrl | quote }}
  {{ .Values.secrets.keys.providerPublicKeys }}: {{ required "secrets.values.providerPublicKeysJson is required when secrets.create=true" .Values.secrets.values.providerPublicKeysJson | quote }}
  {{ .Values.secrets.keys.receiptEncryptionKey }}: {{ required "secrets.values.receiptEncryptionKeyBase64 is required when secrets.create=true" .Values.secrets.values.receiptEncryptionKeyBase64 | quote }}
  {{ .Values.secrets.keys.principalContextHmacSecret }}: {{ required "secrets.values.principalContextHmacSecret is required when secrets.create=true" .Values.secrets.values.principalContextHmacSecret | quote }}
  {{ .Values.secrets.keys.garageRpcSecret }}: {{ required "secrets.values.garageRpcSecret is required when secrets.create=true" .Values.secrets.values.garageRpcSecret | quote }}
  {{ .Values.secrets.keys.garageAdminToken }}: {{ required "secrets.values.garageAdminToken is required when secrets.create=true" .Values.secrets.values.garageAdminToken | quote }}
  {{ .Values.secrets.keys.garageMetricsToken }}: {{ required "secrets.values.garageMetricsToken is required when secrets.create=true" .Values.secrets.values.garageMetricsToken | quote }}
{{- end }}
