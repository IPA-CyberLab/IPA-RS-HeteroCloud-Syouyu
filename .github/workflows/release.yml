name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-syouyu
  CHART: deploy/helm/heterocloud-syouyu
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  verify:
    name: Verify Rust and Helm
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: syouyu
          POSTGRES_PASSWORD: syouyu-ci-password
          POSTGRES_DB: syouyu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syouyu -d syouyu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://syouyu:syouyu-ci-password@127.0.0.1:5432/syouyu?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release identity and artifact contract
        run: |
          python3 -m unittest discover -s scripts/tests -p test_release_artifact.py -v
          python3 scripts/release_artifact.py validate
      - name: Refuse an already published channel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          python3 -c 'import json,os; from pathlib import Path; assets=json.loads((Path(os.environ["RUNNER_TEMP"])/"release-assets.json").read_text())["assets"]; assert not any(a["name"] == "syouyu-release-artifact.json" for a in assets), "channel artifact already published"'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate values schema
        run: jq empty "$CHART/values.schema.json"
      - name: Lint chart
        run: helm lint "$CHART" -f "$CHART/ci/test-values.yaml"
      - name: Test Garage template
        run: bash "$CHART/scripts/test-garage-template.sh"
      - name: Test endpoint and security boundaries
        run: bash "$CHART/scripts/test-boundaries-template.sh"
      - name: Test idempotent layout bootstrap template
        run: bash "$CHART/scripts/test-layout-bootstrap-template.sh"
      - name: Render chart
        run: >-
          helm template syouyu "$CHART"
          --namespace heterocloud-syouyu
          --include-crds
          -f "$CHART/ci/test-values.yaml"
          > /tmp/heterocloud-syouyu.yaml
      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          < /tmp/heterocloud-syouyu.yaml
      - name: Package chart
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package "$CHART" \
            --version "$version" \
            --app-version "$version" \
            --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  image:
    name: Build image (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release identity
        id: release
        run: python3 scripts/release_artifact.py validate >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=HeteroCloud Syouyu
            org.opencontainers.image.description=Managed S3-compatible storage control plane for HeteroCloud
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.heterocloud.cargo-version=${{ steps.release.outputs.cargo_version }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=syouyu-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=syouyu-${{ matrix.arch }}
          provenance: true
          sbom: true
      - name: Export immutable architecture result
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/release_artifact.py generate > "$RUNNER_TEMP/${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.json
          if-no-files-found: error

  manifest:
    name: Publish multi-architecture image
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release identity
        id: release
        run: python3 scripts/release_artifact.py validate >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: dist/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          set -Eeuo pipefail
          python3 scripts/release_artifact.py sources dist/digests/amd64.json dist/digests/arm64.json > "$RUNNER_TEMP/image-sources"
          mapfile -t sources < "$RUNNER_TEMP/image-sources"
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$RELEASE_TAG" != "$VERSION" ]]; then tags+=(--tag "$IMAGE:$RELEASE_TAG"); fi
          if [[ "$LATEST" == true ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            --metadata-file "$RUNNER_TEMP/manifest-metadata.json" "${sources[@]}"
          python3 scripts/release_artifact.py generate --metadata "$RUNNER_TEMP/manifest-metadata.json" > "$RUNNER_TEMP/syouyu-release-artifact.json"
      - name: Verify manifest platforms
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"syouyu-release-artifact.json").read_text())["image"])')"
          inspect="$(docker buildx imagetools inspect "$image")"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"
      - uses: actions/upload-artifact@v4
        with:
          name: channel-artifact
          path: ${{ runner.temp }}/syouyu-release-artifact.json
          if-no-files-found: error

  publish-chart:
    name: Attach Helm chart
    needs: [verify, manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: channel-artifact
          path: dist
      - name: Attach chart and immutable channel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.tgz dist/syouyu-release-artifact.json
