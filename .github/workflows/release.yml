name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-syouyu
  CHART: deploy/helm/heterocloud-syouyu

jobs:
  verify:
    name: Verify Rust and Helm
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: syouyu
          POSTGRES_PASSWORD: syouyu-ci-password
          POSTGRES_DB: syouyu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syouyu -d syouyu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://syouyu:syouyu-ci-password@127.0.0.1:5432/syouyu?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be SemVer, for example v0.1.0" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate values schema
        run: jq empty "$CHART/values.schema.json"
      - name: Lint chart
        run: helm lint "$CHART" -f "$CHART/ci/test-values.yaml"
      - name: Test Garage template
        run: bash "$CHART/scripts/test-garage-template.sh"
      - name: Test endpoint and security boundaries
        run: bash "$CHART/scripts/test-boundaries-template.sh"
      - name: Test idempotent layout bootstrap template
        run: bash "$CHART/scripts/test-layout-bootstrap-template.sh"
      - name: Render chart
        run: >-
          helm template syouyu "$CHART"
          --namespace heterocloud-syouyu
          --include-crds
          -f "$CHART/ci/test-values.yaml"
          > /tmp/heterocloud-syouyu.yaml
      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          < /tmp/heterocloud-syouyu.yaml
      - name: Package chart
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package "$CHART" \
            --version "$version" \
            --app-version "$version" \
            --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  image:
    name: Build image (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=HeteroCloud Syouyu
            org.opencontainers.image.description=Managed S3-compatible storage control plane for HeteroCloud
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=syouyu-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=syouyu-${{ matrix.arch }}
          provenance: true
          sbom: true

  manifest:
    name: Publish multi-architecture image
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$version-amd64" \
            "$IMAGE:$version-arm64"
      - name: Verify manifest platforms
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          inspect="$(docker buildx imagetools inspect "$IMAGE:$version")"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"

  publish-chart:
    name: Attach Helm chart
    needs: [verify, manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
